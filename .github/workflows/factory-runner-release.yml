name: Factory Runner Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Exact Release Please tag
        required: true
        type: string
      version:
        description: Exact Release Please semantic version
        required: true
        type: string
      source_sha:
        description: Exact 40-character release commit
        required: true
        type: string
      upload_url:
        description: Draft release asset upload URL
        required: true
        type: string
      html_url:
        description: Draft release HTML URL
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: factory-runner-release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/ufjmacca/ai-native-factory-runner
  PYTHON_BASE_IMAGE: docker.io/library/python@sha256:76d4b7b6305788c6b4c6a19d6a22a3921bf802e9af4d5e1e5bd771208dba74bf
  UV_BASE_IMAGE: ghcr.io/astral-sh/uv@sha256:2381d6aa60c326b71fd40023f921a0a3b8f91b14d5db6b90402e65a635053709
  RELEASE_ASSET_DIR: release-assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          version: "0.8.15"
          enable-cache: false

      - name: Verify immutable release identity
        id: release-identity
        env:
          GH_TOKEN: ${{ github.token }}
          HTML_URL: ${{ inputs.html_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          UPLOAD_URL: ${{ inputs.upload_url }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${SOURCE_SHA}" = "$(git rev-parse HEAD)"
          test "${SOURCE_SHA}" = "$(git rev-list -n 1 "${TAG_NAME}")"
          test "${TAG_NAME}" = "ai-native-base-v${VERSION}"
          test "${SOURCE_SHA}" = "$(printf '%s' "${SOURCE_SHA}" | grep -E '^[0-9a-f]{40}$')"
          test "${VERSION}" = "$(printf '%s' "${VERSION}" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')"
          test "${UPLOAD_URL}" = "$(printf '%s' "${UPLOAD_URL}" | grep -E '^https://uploads\.github\.com/repos/ufJmacca/ai-native/releases/[1-9][0-9]*/assets(\{\?name,label\})?$')"
          release_json="$(gh release view "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json createdAt,isDraft,tagName,targetCommitish,url)"
          jq -e \
            --arg html_url "${HTML_URL}" \
            --arg tag "${TAG_NAME}" \
            '.isDraft == true and .tagName == $tag and .url == $html_url' \
            <<<"${release_json}" >/dev/null
          released_at="$(jq -r '.createdAt' <<<"${release_json}")"
          test -n "${released_at}"
          printf 'released_at=%s\n' "${released_at}" >>"${GITHUB_OUTPUT}"

      - name: Build release wheel once
        id: wheel
        env:
          AINATIVE_FACTORY_BUILD_SOURCE_COMMIT: ${{ inputs.source_sha }}
          AINATIVE_FACTORY_BUILD_SOURCE_TAG: ${{ inputs.tag_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test ! -e dist
          uv build --wheel
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          expected="ai_native_base-${VERSION}-py3-none-any.whl"
          test "$(basename "${wheel}")" = "${expected}"
          wheel_sha="sha256:$(sha256sum "${wheel}" | cut -d ' ' -f 1)"
          schema_set="$(tr -d '\n' < ai_native/schemas/factory_runner/v1/schema-set.sha256)"
          schema_manifest_sha="sha256:$(sha256sum ai_native/schemas/factory_runner/v1/schema-manifest.json | cut -d ' ' -f 1)"
          printf 'filename=%s\n' "${expected}" >>"${GITHUB_OUTPUT}"
          printf 'path=%s\n' "${wheel}" >>"${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${wheel_sha}" >>"${GITHUB_OUTPUT}"
          printf 'schema_set=%s\n' "${schema_set}" >>"${GITHUB_OUTPUT}"
          printf 'schema_manifest_sha=%s\n' "${schema_manifest_sha}" >>"${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Reject an existing release image tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          inspection_error="${RUNNER_TEMP}/factory-runner-image-inspect.err"
          if docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${VERSION}" \
            >/dev/null 2>"${inspection_error}"; then
            echo "release image tag already exists; a corrected artifact requires a new release" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found|404' "${inspection_error}"; then
            cat "${inspection_error}" >&2
            echo "unable to prove that the release image tag is unused" >&2
            exit 1
          fi

      - name: Build and push immutable OCI image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: images/factory-runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ inputs.version }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            UV_BASE_IMAGE=${{ env.UV_BASE_IMAGE }}
            FACTORY_RUNNER_CREATED=${{ steps.release-identity.outputs.released_at }}
            FACTORY_RUNNER_SCHEMA_MANIFEST_SHA256=${{ steps.wheel.outputs.schema_manifest_sha }}
            FACTORY_RUNNER_SCHEMA_SET_DIGEST=${{ steps.wheel.outputs.schema_set }}
            FACTORY_RUNNER_SOURCE_COMMIT=${{ inputs.source_sha }}
            FACTORY_RUNNER_SOURCE_TAG=${{ inputs.tag_name }}
            FACTORY_RUNNER_VERSION=${{ inputs.version }}
            FACTORY_RUNNER_WHEEL_SHA256=${{ steps.wheel.outputs.sha256 }}

      - name: Run receipt-resolved compatibility suite
        env:
          GENERATED_AT: ${{ steps.release-identity.outputs.released_at }}
          IMAGE_REFERENCE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ASSET_DIR}"
          uv run python scripts/run_factory_runner_compatibility.py \
            --source-commit "${SOURCE_SHA}" \
            --wheel "${WHEEL_PATH}" \
            --oci-image "${IMAGE_REFERENCE}" \
            --generated-at "${GENERATED_AT}" \
            --work-dir "${RUNNER_TEMP}/factory-runner-compatibility" \
            --output "${RELEASE_ASSET_DIR}/compatibility-report.json"

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ env.RELEASE_ASSET_DIR }}/factory-runner.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Run blocking vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          version: v0.70.0
          format: json
          output: ${{ env.RELEASE_ASSET_DIR }}/trivy-report.json
          scanners: vuln
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"

      - name: Attest wheel provenance
        id: wheel-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ steps.wheel.outputs.path }}

      - name: Preserve wheel provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.wheel-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "${BUNDLE_PATH}" "${RELEASE_ASSET_DIR}/provenance.intoto.jsonl"

      - name: Attest image provenance
        id: image-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ env.RELEASE_ASSET_DIR }}/factory-runner.spdx.json
          push-to-registry: true

      - name: Stage the release wheel
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          cp -- "${WHEEL_PATH}" "${RELEASE_ASSET_DIR}/"

      - name: Build and verify release receipt
        env:
          ATTESTATION_URL: ${{ steps.image-attestation.outputs.attestation-url }}
          IMAGE_REFERENCE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          RELEASED_AT: ${{ steps.release-identity.outputs.released_at }}
        run: |
          set -euo pipefail
          uv run python scripts/build_factory_runner_release_receipt.py \
            --version "${{ inputs.version }}" \
            --tag "${{ inputs.tag_name }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --released-at "${RELEASED_AT}" \
            --wheel "${RELEASE_ASSET_DIR}/${{ steps.wheel.outputs.filename }}" \
            --oci-reference "${IMAGE_REFERENCE}" \
            --platform linux/amd64 \
            --schema-set ai_native/schemas/factory_runner/v1/schema-set.sha256 \
            --schema-manifest ai_native/schemas/factory_runner/v1/schema-manifest.json \
            --compatibility-report "${RELEASE_ASSET_DIR}/compatibility-report.json" \
            --sbom "${RELEASE_ASSET_DIR}/factory-runner.spdx.json" \
            --vulnerability-report "${RELEASE_ASSET_DIR}/trivy-report.json" \
            --vulnerability-scanner "Trivy v0.70.0" \
            --vulnerability-policy "no-fixable-high-or-critical/v1" \
            --provenance "${RELEASE_ASSET_DIR}/provenance.intoto.jsonl" \
            --attestation-url "${ATTESTATION_URL}" \
            --output "${RELEASE_ASSET_DIR}/factory-runner-release-receipt.json"

      - name: Attest release receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ env.RELEASE_ASSET_DIR }}/factory-runner-release-receipt.json

      - name: Upload immutable draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "${RELEASE_ASSET_DIR}" -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 6
          gh release upload "${{ inputs.tag_name }}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify draft assets from a clean directory
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          clean_root="$(mktemp -d)"
          clean_assets="${clean_root}/assets"
          mkdir "${clean_assets}"
          gh release download "${{ inputs.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${clean_assets}" \
            --pattern 'ai_native_base-*.whl' \
            --pattern 'compatibility-report.json' \
            --pattern 'factory-runner.spdx.json' \
            --pattern 'trivy-report.json' \
            --pattern 'provenance.intoto.jsonl' \
            --pattern 'factory-runner-release-receipt.json'
          gh attestation verify \
            "${clean_assets}/${{ steps.wheel.outputs.filename }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/factory-runner-release.yml" \
            --source-digest "${{ inputs.source_sha }}"
          gh attestation verify \
            "${clean_assets}/factory-runner-release-receipt.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/factory-runner-release.yml" \
            --source-digest "${{ inputs.source_sha }}"
          gh attestation verify \
            "oci://${IMAGE_REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/factory-runner-release.yml" \
            --source-digest "${{ inputs.source_sha }}"
          gh attestation verify \
            "oci://${IMAGE_REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/factory-runner-release.yml" \
            --source-digest "${{ inputs.source_sha }}" \
            --predicate-type "https://spdx.dev/Document/v2.3"
          uv venv \
            --python "$(command -v python3)" \
            "${clean_root}/verifier"
          clean_python="${clean_root}/verifier/bin/python"
          uv pip install \
            --python "${clean_python}" \
            "${clean_assets}/${{ steps.wheel.outputs.filename }}"
          (
            cd "${clean_root}"
            "${clean_python}" -I \
              -m ai_native.factory_runner.release_verification \
              --receipt "${clean_assets}/factory-runner-release-receipt.json" \
              --artifact-dir "${clean_assets}" \
              --json
          )

      - name: Publish verified release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
          gh release view "${{ inputs.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq 'select(.isDraft == false)'
