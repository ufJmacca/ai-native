name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build workspace image
        run: docker compose build workspace
      - name: Bootstrap workspace
        run: docker compose run --rm --user root workspace uv sync
      - name: Check factory protocol schema drift
        run: docker compose run --rm --user root workspace uv run python scripts/generate_factory_runner_schemas.py --check
      - name: Run test suite
        run: docker compose run --rm --user root workspace uv run pytest
